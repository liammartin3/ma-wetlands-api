name: CI

on:
  push:
  pull_request:

jobs:
  # Lint + data quality unit tests + end-to-end build tests (synthetic data).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -v tests --ignore=tests/api

  # Start pygeoapi in Docker on the sample GeoPackage and test the live API.
  api:
    runs-on: ubuntu-latest
    needs: test
    env:
      DATA_DIR: ./data/ci
      DATA_FILE: data/ci/ma_wetlands.gpkg
      REQUIRE_API: "1"   # fail (not skip) if the server isn't up
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # Serve a copy: the SQLiteGPKG provider writes into the file it serves.
      - run: mkdir -p data/ci && cp tests/fixtures/ma_wetlands_sample.gpkg data/ci/ma_wetlands.gpkg
      - run: docker compose up -d --wait
      - run: pytest -v -rs tests/api   # -rs lists any skipped tests and why
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down
