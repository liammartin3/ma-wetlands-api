# pygeoapi configuration for the Massachusetts Wetlands API.
# Reference: https://docs.pygeoapi.io/en/latest/configuration.html
server:
  bind:
    host: 0.0.0.0
    port: 80
  # Public URL used in links. Set PYGEOAPI_SERVER_URL in docker-compose / on the server.
  url: ${PYGEOAPI_SERVER_URL:-http://localhost:5050}
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  gzip: true            # polygons compress well; smaller responses
  language: en-US
  cors: true            # allow browser clients (web maps) on other origins
  pretty_print: false
  limits:
    default_items: 10   # items per page when the client doesn't ask
    max_items: 500      # cap so one request can't pull huge pages
    on_exceed: throttle # silently clamp to max_items instead of erroring
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'

logging:
  level: ERROR

metadata:
  identification:
    title: Massachusetts Wetlands API
    description: >-
      OGC API - Features service for U.S. Fish and Wildlife Service National
      Wetlands Inventory (NWI) wetland polygons in Massachusetts, validated by
      automated data quality checks.
    keywords: [wetlands, NWI, Massachusetts, OGC API - Features]
    keywords_type: theme
    terms_of_service: https://www.fws.gov/program/national-wetlands-inventory/data-download
    url: https://github.com/liammartin3/ma-wetlands-api
  license:
    name: NWI data from U.S. Fish and Wildlife Service; see source for terms
    url: https://www.fws.gov/program/national-wetlands-inventory/data-download
  provider:
    name: Liam Martin (portfolio project; not affiliated with USFWS)
    url: https://liammartin3.github.io
  contact:
    name: Martin, Liam
    url: https://liammartin3.github.io
    role: pointOfContact

resources:
  wetlands:
    type: collection
    title: NWI Wetlands - Massachusetts
    description: >-
      Wetland and deepwater habitat polygons from the National Wetlands
      Inventory. ATTRIBUTE is the Cowardin classification code; WETLAND_TYPE is
      the simplified type. ACRES is the value published by NWI; ACRES_GEOM is
      computed from the geometry (they differ for polygons clipped at the state
      boundary - see the data quality report).
    keywords: [wetlands, NWI, Cowardin]
    links:
      - type: text/html
        rel: canonical
        title: NWI data download (source)
        href: https://www.fws.gov/program/national-wetlands-inventory/data-download
        hreflang: en-US
    extents:
      spatial:
        # From the built GeoPackage's total bounds, rounded outward.
        bbox: [-73.63, 41.18, -69.86, 43.01]
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
    providers:
      - type: feature
        # Stock SQLite/GeoPackage provider. Chosen over OGR for correct paging;
        # see benchmarks/README.md for the comparison.
        name: SQLiteGPKG
        data: /data/ma_wetlands.gpkg
        id_field: NWI_ID
        table: wetlands
